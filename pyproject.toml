[project]
name = "espn-edge"
version = "1.0.0"
description = "ESPN Edge — multi-account, multi-league fantasy advantage tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "espn-api>=0.44",
    "python-dotenv>=1.0",
    "nflreadpy>=0.1.5,<0.2",
    # The PostgreSQL driver. `Settings.sqlalchemy_url` documents PostgreSQL as
    # a backend and every deploy document writes `postgresql+psycopg2://`, yet
    # no driver was declared: the image's install had none, and both ECS
    # tasks would have raised ModuleNotFoundError at engine creation. Every
    # PostgreSQL claim had been verified in a venv where the driver was
    # hand-installed. `-binary` because python:3.12-slim has no compiler or
    # pg_config; the source distribution cannot build there.
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# The deployable image installs this extra, not a bare `.`.
#
# Nothing under `api/` imports alembic -- the application connects as a role
# with no DDL rights and cannot migrate. But the SAME image runs the one-off
# migrate task (`alembic upgrade head`, see infra/app.py), so alembic is a
# dependency of the ARTEFACT even though it is not a dependency of serving.
# Keeping it out of `[project] dependencies` keeps that distinction, and keeps
# `api/Dockerfile`'s hand-copied list (pinned by
# tests/test_container_dependencies.py) honest about what *serving* needs.
#
# It appears in `dev` as well, so a developer's `pip install -e ".[dev]"` is
# unchanged. tests/test_image_commands.py pins the two spellings together.
migrate = ["alembic>=1.13"]
dev = [
    "alembic>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Alembic revisions are generated; reflowing generated DDL by hand is how a
# migration acquires an edit nobody reviewed.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
