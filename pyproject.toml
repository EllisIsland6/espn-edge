[project]
name = "espn-edge"
version = "1.0.0"
description = "ESPN Edge — multi-account, multi-league fantasy advantage tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "espn-api>=0.44",
    "python-dotenv>=1.0",
    "nflreadpy>=0.1.5,<0.2",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Alembic revisions are generated; reflowing generated DDL by hand is how a
# migration acquires an edit nobody reviewed.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
