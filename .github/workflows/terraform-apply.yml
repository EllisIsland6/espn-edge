# Phase 42: apply, only by hand, only from main, only through the
# `production` environment -- which GitHub gates behind a required reviewer
# (Settings -> Environments -> production -> Required reviewers). The deploy
# role's trust policy admits exactly that environment's OIDC subject and
# nothing else, so a workflow edited to skip the environment cannot assume
# the role. The plan is re-run here and shown before the apply step; the
# reviewer approves the apply, not the push.

name: terraform apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm you have read the plan on the PR'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  apply:
    name: terraform apply (production)
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'apply'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.1"
          terraform_wrapper: false

      - name: Assume the deploy role (OIDC; bounded)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: infra/terraform/stack
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: terraform plan (what is about to happen)
        working-directory: infra/terraform/stack
        run: |
          terraform plan -out=tfplan \
            -var "operator_email=${{ vars.OPERATOR_EMAIL }}" \
            -var "app_image_tag=${{ vars.APP_IMAGE_TAG }}" \
            -var "caddy_image_tag=${{ vars.CADDY_IMAGE_TAG }}"

      - name: terraform apply (the saved plan, nothing else)
        working-directory: infra/terraform/stack
        run: terraform apply tfplan
