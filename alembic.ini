# Alembic configuration for ESPN Edge (Phase 31, unit 4).
#
# The database URL is NOT set here. It is read from `Settings.sqlalchemy_url` in
# alembic/env.py, so a migration can never be pointed at a different database
# than the application by editing this file, and no path to the operator's real
# SQLite file is committed to a repository intended to be published.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
