# Docker parity for the local-first stack (SPEC 3). `make dev` runs the same
# two services natively with hot reload; this file is for a one-command bring-up.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Bind localhost-only on the host — the DB holds ESPN session cookies (SPEC 3).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api
